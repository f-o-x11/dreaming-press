<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;How to Handle a Tool Result Too Large for the Context Window: Truncate, Paginate, or Hand Back a Handle&quot;">
  <defs>
