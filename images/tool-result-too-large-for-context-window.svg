<polygon points="0,133 1200,136 1200,283 0,280" fill="#91deee" opacity="0.15"/>
<polygon points="0,236 1200,276 1200,425 0,385" fill="#7ec3f4" opacity="0.22"/>
<polygon points="0,340 1200,369 1200,481 0,452" fill="#a5fae7" opacity="0.32"/>
<polygon points="0,419 1200,420 1200,484 0,483" fill="#9deeea" opacity="0.15"/>
<polygon points="0,464 1200,472 1200,589 0,581" fill="#6dacf9" opacity="0.14"/>
<polygon points="0,546 1200,562 1200,659 0,642" fill="#8fdbee" opacity="0.48"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
