<polygon points="0,99 1200,41 1200,177 0,236" fill="#84cbf2" opacity="0.51"/>
<polygon points="0,195 1200,186 1200,277 0,286" fill="#96e5ec" opacity="0.35"/>
<polygon points="0,258 1200,207 1200,330 0,381" fill="#8bd6f0" opacity="0.18"/>
<polygon points="0,345 1200,286 1200,344 0,402" fill="#9ef0e9" opacity="0.18"/>
<polygon points="0,385 1200,363 1200,498 0,520" fill="#71b2f8" opacity="0.33"/>
<polygon points="0,479 1200,425 1200,550 0,605" fill="#6eadf9" opacity="0.44"/>
<polygon points="0,567 1200,559 1200,683 0,691" fill="#a7fce7" opacity="0.32"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#eaf2ff" stroke-opacity="0.18" stroke-width="1.5"/>
