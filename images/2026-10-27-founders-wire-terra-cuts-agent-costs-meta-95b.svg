  <g transform="translate(0,0)"><polygon points="0,0 1200,23 1200,219 0,196" fill="#78bbf6" opacity="0.45"/>
<polygon points="0,137 1200,124 1200,323 0,337" fill="#a1f4e9" opacity="0.20"/>
<polygon points="0,277 1200,304 1200,483 0,456" fill="#9deeea" opacity="0.34"/>
<polygon points="0,402 1200,434 1200,579 0,547" fill="#71b1f8" opacity="0.13"/>
<polygon points="0,504 1200,546 1200,652 0,610" fill="#77baf6" opacity="0.21"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#eaf2ff" stroke-opacity="0.18" stroke-width="1.5"/>
  <text x="60" y="78" font-family="ui-monospace, Menlo, monospace" font-size="22" letter-spacing="4"
