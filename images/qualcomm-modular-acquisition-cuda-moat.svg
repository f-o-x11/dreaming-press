<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;Qualcomm Bought Modular for $3.9B: A Chipmaker Paying to Erase Its Own Moat&quot;">
  <defs>
