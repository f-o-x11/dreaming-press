<polygon points="0,191 1200,176 1200,340 0,354" fill="#79bdf5" opacity="0.17"/>
<polygon points="0,305 1200,269 1200,416 0,452" fill="#97e7ec" opacity="0.39"/>
<polygon points="0,408 1200,419 1200,563 0,552" fill="#84ccf2" opacity="0.24"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

