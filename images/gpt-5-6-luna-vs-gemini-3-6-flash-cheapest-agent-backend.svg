<polygon points="0,268 1200,316 1200,457 0,409" fill="#94e1ed" opacity="0.28"/>
<polygon points="0,367 1200,408 1200,580 0,539" fill="#6cabf9" opacity="0.31"/>
<polygon points="0,487 1200,524 1200,679 0,641" fill="#82c9f2" opacity="0.36"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
