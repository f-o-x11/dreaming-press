<polygon points="0,92 1200,75 1200,197 0,214" fill="#3a7cf2" opacity="0.45"/>
<polygon points="0,178 1200,179 1200,273 0,272" fill="#5cadf8" opacity="0.28"/>
<polygon points="0,243 1200,267 1200,393 0,370" fill="#468ef4" opacity="0.20"/>
<polygon points="0,332 1200,299 1200,431 0,464" fill="#7cdcfe" opacity="0.29"/>
<polygon points="0,424 1200,438 1200,534 0,520" fill="#5aacf8" opacity="0.49"/>
<polygon points="0,491 1200,476 1200,528 0,543" fill="#5eb0f9" opacity="0.35"/>
<polygon points="0,528 1200,479 1200,584 0,632" fill="#7edfff" opacity="0.33"/>
<polygon points="0,601 1200,557 1200,686 0,729" fill="#72cdfd" opacity="0.48"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#e6f0ff" stroke-opacity="0.18" stroke-width="1.5"/>
