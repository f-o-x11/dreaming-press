<polygon points="0,199 1200,178 1200,228 0,249" fill="#5eb0f9" opacity="0.31"/>
<polygon points="0,234 1200,216 1200,313 0,331" fill="#54a3f7" opacity="0.28"/>
<polygon points="0,302 1200,341 1200,417 0,377" fill="#3a7df2" opacity="0.49"/>
