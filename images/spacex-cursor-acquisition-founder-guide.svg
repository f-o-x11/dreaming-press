<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;SpaceX Is Buying Your IDE: What the $60B Cursor Deal Means If Your Team Runs on Cursor&quot;">
  <defs>
