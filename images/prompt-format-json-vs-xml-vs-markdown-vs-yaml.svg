<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;Prompt Format: JSON vs XML vs Markdown vs YAML — and Why Input and Output Want Opposite Things&quot;">
