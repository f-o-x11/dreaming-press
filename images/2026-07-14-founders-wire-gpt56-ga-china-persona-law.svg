<polygon points="0,49 1200,-10 1200,109 0,168" fill="#7bdafe" opacity="0.31"/>
<polygon points="0,132 1200,174 1200,275 0,233" fill="#4d98f6" opacity="0.38"/>
<polygon points="0,202 1200,213 1200,378 0,368" fill="#6ec8fc" opacity="0.46"/>
<polygon points="0,318 1200,327 1200,476 0,466" fill="#387bf2" opacity="0.43"/>
<polygon points="0,422 1200,419 1200,550 0,553" fill="#5eb0f9" opacity="0.14"/>
<polygon points="0,513 1200,553 1200,706 0,667" fill="#3677f1" opacity="0.30"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

