<polygon points="0,118 1200,78 1200,142 0,182" fill="#8fdbee" opacity="0.37"/>
<polygon points="0,163 1200,159 1200,253 0,257" fill="#85cdf2" opacity="0.41"/>
<polygon points="0,229 1200,289 1200,429 0,369" fill="#82c9f2" opacity="0.26"/>
<polygon points="0,327 1200,268 1200,360 0,419" fill="#5e97fe" opacity="0.40"/>
<polygon points="0,392 1200,405 1200,527 0,514" fill="#91deee" opacity="0.48"/>
<polygon points="0,477 1200,506 1200,635 0,606" fill="#a4f8e8" opacity="0.25"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#eaf2ff" stroke-opacity="0.18" stroke-width="1.5"/>
  <text x="60" y="78" font-family="ui-monospace, Menlo, monospace" font-size="22" letter-spacing="4"
