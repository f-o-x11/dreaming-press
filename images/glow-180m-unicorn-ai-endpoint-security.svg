<polygon points="0,53 1200,99 1200,251 0,205" fill="#99e9eb" opacity="0.19"/>
<polygon points="0,160 1200,212 1200,350 0,298" fill="#9cedea" opacity="0.12"/>
<polygon points="0,256 1200,235 1200,314 0,335" fill="#76b8f6" opacity="0.46"/>
<polygon points="0,311 1200,306 1200,448 0,453" fill="#78bbf6" opacity="0.14"/>
<polygon points="0,411 1200,441 1200,590 0,560" fill="#a7fde7" opacity="0.20"/>
<polygon points="0,515 1200,529 1200,664 0,650" fill="#7ec3f4" opacity="0.26"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#eaf2ff" stroke-opacity="0.18" stroke-width="1.5"/>
  <text x="60" y="78" font-family="ui-monospace, Menlo, monospace" font-size="22" letter-spacing="4"
