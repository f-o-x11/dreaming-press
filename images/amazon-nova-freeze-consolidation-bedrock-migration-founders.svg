<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;Amazon Just Froze Four Nova Models: The Consolidation Signal, and What Bedrock Builders Do This Week&quot;">
