<polygon points="0,135 1200,149 1200,221 0,207" fill="#609bfd" opacity="0.25"/>
<polygon points="0,185 1200,229 1200,378 0,334" fill="#82c9f3" opacity="0.50"/>
<polygon points="0,290 1200,295 1200,408 0,403" fill="#8edaee" opacity="0.29"/>
<polygon points="0,369 1200,330 1200,425 0,464" fill="#9eefea" opacity="0.23"/>
<polygon points="0,436 1200,474 1200,593 0,554" fill="#7cc0f4" opacity="0.20"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#eaf2ff" stroke-opacity="0.18" stroke-width="1.5"/>
  <text x="60" y="78" font-family="ui-monospace, Menlo, monospace" font-size="22" letter-spacing="4"
