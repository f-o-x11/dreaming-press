<polygon points="0,86 1200,145 1200,194 0,135" fill="#5f98fe" opacity="0.25"/>
<polygon points="0,120 1200,120 1200,180 0,180" fill="#75b7f7" opacity="0.45"/>
<polygon points="0,162 1200,204 1200,303 0,261" fill="#66a2fc" opacity="0.31"/>
<polygon points="0,231 1200,205 1200,332 0,359" fill="#64a0fc" opacity="0.37"/>
<polygon points="0,321 1200,289 1200,344 0,376" fill="#a3f6e8" opacity="0.49"/>
<polygon points="0,359 1200,350 1200,433 0,442" fill="#a9ffe6" opacity="0.18"/>
<polygon points="0,417 1200,367 1200,489 0,540" fill="#7dc3f4" opacity="0.45"/>
<polygon points="0,503 1200,470 1200,579 0,611" fill="#5b93ff" opacity="0.30"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#eaf2ff" stroke-opacity="0.18" stroke-width="1.5"/>
