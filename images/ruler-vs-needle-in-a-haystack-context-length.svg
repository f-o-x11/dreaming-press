<polygon points="0,126 1200,156 1200,364 0,333" fill="#5bacf8" opacity="0.20"/>
<polygon points="0,271 1200,318 1200,476 0,430" fill="#5bacf8" opacity="0.17"/>
<polygon points="0,382 1200,438 1200,539 0,483" fill="#72cefd" opacity="0.48"/>
<polygon points="0,453 1200,484 1200,615 0,584" fill="#2f6ef0" opacity="0.49"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#e6f0ff" stroke-opacity="0.18" stroke-width="1.5"/>
  <text x="60" y="78" font-family="ui-monospace, Menlo, monospace" font-size="22" letter-spacing="4"
