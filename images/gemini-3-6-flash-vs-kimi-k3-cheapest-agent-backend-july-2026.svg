<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;Gemini 3.6 Flash vs Kimi K3: The Cheapest Capable Agent Backend After July's Price War&quot;">
