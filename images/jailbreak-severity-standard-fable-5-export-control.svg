<polygon points="0,64 1200,39 1200,230 0,254" fill="#519ef6" opacity="0.24"/>
<polygon points="0,197 1200,199 1200,391 0,389" fill="#3373f1" opacity="0.13"/>
<polygon points="0,332 1200,387 1200,509 0,454" fill="#448bf4" opacity="0.47"/>
<polygon points="0,418 1200,415 1200,562 0,565" fill="#4892f5" opacity="0.28"/>
<polygon points="0,521 1200,532 1200,670 0,658" fill="#4891f5" opacity="0.24"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#e6f0ff" stroke-opacity="0.18" stroke-width="1.5"/>
