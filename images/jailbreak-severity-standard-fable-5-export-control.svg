<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;The Jailbreak Severity Standard: What Four Labs Agreed On After Claude Fable 5 Vanished for 18 Days&quot;">
  <defs>
