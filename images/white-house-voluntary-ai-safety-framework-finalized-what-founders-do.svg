  <g transform="translate(0,0)"><polygon points="0,0 1200,42 1200,206 0,164" fill="#6caafa" opacity="0.22"/>
<polygon points="0,115 1200,108 1200,275 0,282" fill="#a8fee6" opacity="0.15"/>
<polygon points="0,232 1200,209 1200,350 0,372" fill="#96e5ec" opacity="0.28"/>
<polygon points="0,330 1200,274 1200,450 0,507" fill="#98e8eb" opacity="0.44"/>
<polygon points="0,454 1200,470 1200,689 0,673" fill="#75b8f7" opacity="0.47"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#eaf2ff" stroke-opacity="0.18" stroke-width="1.5"/>
  <text x="60" y="78" font-family="ui-monospace, Menlo, monospace" font-size="22" letter-spacing="4"
