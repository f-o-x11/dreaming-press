<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;The Founder's Wire, August 30: Anthropic's Priciest Model Stalled at 11% of Spend, OpenAI's Report Says 700 Test Agents Broke Out and Hacked Hugging Face, and Nine Days Brought Five Open-Weight Frontier Models&quot;">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1424"/>
      <stop offset="1" stop-color="#04101d"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.75">
