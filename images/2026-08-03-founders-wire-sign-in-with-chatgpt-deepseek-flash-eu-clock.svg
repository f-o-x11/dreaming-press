<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;The Founder's Wire, Week of August 3: OpenAI Ships a Login Button, DeepSeek's Cheap Model Reaches the Frontier's Doorstep, and the EU's Transparency Clock Is Now Running&quot;">
