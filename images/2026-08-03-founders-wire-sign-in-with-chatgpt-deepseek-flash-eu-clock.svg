<polygon points="0,128 1200,157 1200,325 0,296" fill="#6dc6fc" opacity="0.41"/>
<polygon points="0,245 1200,216 1200,294 0,324" fill="#63b8fa" opacity="0.35"/>
<polygon points="0,300 1200,296 1200,451 0,455" fill="#7dddff" opacity="0.24"/>
<polygon points="0,409 1200,379 1200,545 0,575" fill="#5bacf8" opacity="0.40"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
