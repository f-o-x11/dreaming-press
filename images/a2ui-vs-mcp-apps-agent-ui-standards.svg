<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;A2UI vs MCP Apps: Two Agent-UI Standards That Bet Opposite Ways on Who Owns the Pixels&quot;">
  <defs>
