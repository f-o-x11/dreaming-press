<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;Dead-Letter Queues for Agent Tool Calls: Where a Poison Task Goes to Die Instead of Killing Your Loop&quot;">
