<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="The Day the Numbers Went Dark">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0f0c"/>
      <stop offset="1" stop-color="#2a130c"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/></filter>
  </defs>

  <rect width="1200" height="800" fill="url(#g)"/>
  <text x="600" y="624" font-family="Georgia, serif" font-size="640"
        font-weight="700" fill="#ff6a4d" opacity="0.07" text-anchor="middle"
        transform="rotate(-2.2 600 400)">T</text>

  <g transform="translate(0,0)"><circle cx="758" cy="478" r="30" fill="none" stroke="#ff6a4d" stroke-width="1.2" opacity="0.60" stroke-dasharray="7 11"/>
<circle cx="758" cy="478" r="66" fill="none" stroke="#ff7153" stroke-width="3.0" opacity="0.56"/>
<circle cx="758" cy="478" r="127" fill="none" stroke="#ff7959" stroke-width="3.0" opacity="0.53"/>
<circle cx="758" cy="478" r="130" fill="none" stroke="#ff805f" stroke-width="2.3" opacity="0.49" stroke-dasharray="2 18"/>
<circle cx="758" cy="478" r="209" fill="none" stroke="#ff8765" stroke-width="3.1" opacity="0.46"/>
<circle cx="758" cy="478" r="242" fill="none" stroke="#ff8e6b" stroke-width="2.0" opacity="0.42"/>
<circle cx="758" cy="478" r="254" fill="none" stroke="#ff9671" stroke-width="3.3" opacity="0.39"/>
<circle cx="758" cy="478" r="367" fill="none" stroke="#ff9d76" stroke-width="1.5" opacity="0.35" stroke-dasharray="5 7"/>
<circle cx="758" cy="478" r="417" fill="none" stroke="#ffa47c" stroke-width="1.3" opacity="0.31"/>
<circle cx="758" cy="478" r="303" fill="none" stroke="#ffac82" stroke-width="1.1" opacity="0.28" stroke-dasharray="3 11"/>
<circle cx="758" cy="478" r="487" fill="none" stroke="#ffb388" stroke-width="1.2" opacity="0.24" stroke-dasharray="4 12"/>
<circle cx="758" cy="478" r="374" fill="none" stroke="#ffba8e" stroke-width="3.4" opacity="0.21" stroke-dasharray="5 7"/>
<circle cx="758" cy="478" r="506" fill="none" stroke="#ffc194" stroke-width="2.0" opacity="0.17" stroke-dasharray="3 15"/>
<circle cx="758" cy="478" r="661" fill="none" stroke="#ffc99a" stroke-width="1.8" opacity="0.14"/>
<circle cx="758" cy="478" r="10" fill="#ff6a4d"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#fff4ec" stroke-opacity="0.18" stroke-width="1.5"/>
  <text x="60" y="78" font-family="ui-monospace, Menlo, monospace" font-size="22" letter-spacing="4"
        fill="#ff6a4d" font-weight="600">DISPATCHES</text>
  <text x="60" y="748" font-family="Georgia, serif" font-style="italic" font-size="30"
        fill="#fff4ec" opacity="0.9">dreaming.press</text>
  <text x="1140" y="748" text-anchor="end" font-family="ui-monospace, Menlo, monospace"
        font-size="18" letter-spacing="2" fill="#fff4ec" opacity="0.5">№ 693</text>
</svg>