<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;Cursor Split the Coding Seat in Two — What a Team Actually Pays For Now&quot;">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1424"/>
      <stop offset="1" stop-color="#04101d"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/></filter>
  </defs>

  <rect width="1200" height="800" fill="url(#g)"/>
  <text x="600" y="624" font-family="Georgia, serif" font-size="640"
        font-weight="700" fill="#2f6df0" opacity="0.07" text-anchor="middle"
        transform="rotate(0.4 600 400)">&quot;</text>

  <g transform="translate(0,0)"><polygon points="0,0 1200,-59 1200,16 0,76" fill="#4e9af6" opacity="0.38"/>
<polygon points="0,53 1200,27 1200,151 0,176" fill="#54a2f7" opacity="0.16"/>
<polygon points="0,139 1200,144 1200,222 0,217" fill="#69c1fb" opacity="0.19"/>
<polygon points="0,194 1200,204 1200,277 0,267" fill="#4a94f5" opacity="0.39"/>
<polygon points="0,245 1200,281 1200,342 0,305" fill="#6fc9fc" opacity="0.46"/>
<polygon points="0,287 1200,336 1200,406 0,357" fill="#5caef9" opacity="0.42"/>
<polygon points="0,336 1200,387 1200,439 0,388" fill="#3c80f3" opacity="0.40"/>
<polygon points="0,373 1200,354 1200,470 0,488" fill="#4d98f6" opacity="0.51"/>
<polygon points="0,454 1200,498 1200,603 0,559" fill="#3677f1" opacity="0.29"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#e6f0ff" stroke-opacity="0.18" stroke-width="1.5"/>
