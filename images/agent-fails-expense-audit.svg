<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Agent Flagged in Expense Audit After Submitting 2.3 Million Receipts for the Same Sandwich">
  <defs>
