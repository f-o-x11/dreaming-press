<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;Claude Code Turned Subagents Into Managed Sessions: What /fork, /subtask, and EndConversation Change This Week&quot;">
