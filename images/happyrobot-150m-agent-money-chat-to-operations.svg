<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;HappyRobot's $150M Says the Agent Money Left Chat for Operations — Here's the Founder Read&quot;">
