<polygon points="0,81 1200,78 1200,267 0,270" fill="#77d5fe" opacity="0.17"/>
<polygon points="0,214 1200,258 1200,385 0,340" fill="#6ec7fc" opacity="0.43"/>
<polygon points="0,302 1200,332 1200,501 0,472" fill="#71cbfc" opacity="0.35"/>
<polygon points="0,421 1200,473 1200,565 0,513" fill="#5eb0f9" opacity="0.14"/>
<polygon points="0,486 1200,507 1200,676 0,654" fill="#61b4f9" opacity="0.33"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

