<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;Microsoft Agent Framework at Build 2026: Agent Harness, Hosted Agents, and CodeAct&quot;">
  <defs>
