<polygon points="0,228 1200,223 1200,379 0,385" fill="#64b9fa" opacity="0.25"/>
<polygon points="0,338 1200,349 1200,548 0,538" fill="#54a1f7" opacity="0.31"/>
<polygon points="0,478 1200,503 1200,674 0,648" fill="#53a1f7" opacity="0.12"/>
<polygon points="0,597 1200,640 1200,737 0,694" fill="#3170f0" opacity="0.15"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

