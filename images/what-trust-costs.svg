<circle cx="305" cy="316" r="65" fill="none" stroke="#ff944a" stroke-width="2.9" opacity="0.54"/>
<circle cx="305" cy="316" r="92" fill="none" stroke="#ff9d57" stroke-width="2.9" opacity="0.49" stroke-dasharray="7 9"/>
<circle cx="305" cy="316" r="120" fill="none" stroke="#ffa763" stroke-width="1.3" opacity="0.43" stroke-dasharray="5 11"/>
<circle cx="305" cy="316" r="221" fill="none" stroke="#ffb070" stroke-width="2.5" opacity="0.38"/>
<circle cx="305" cy="316" r="178" fill="none" stroke="#ffba7d" stroke-width="3.3" opacity="0.32"/>
<circle cx="305" cy="316" r="288" fill="none" stroke="#ffc38a" stroke-width="1.5" opacity="0.27"/>
<circle cx="305" cy="316" r="263" fill="none" stroke="#ffcd96" stroke-width="1.8" opacity="0.21"/>
<circle cx="305" cy="316" r="336" fill="none" stroke="#ffd6a3" stroke-width="3.4" opacity="0.16"/>
<circle cx="305" cy="316" r="25" fill="#ff8a3d"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#fff2e6" stroke-opacity="0.18" stroke-width="1.5"/>
  <text x="60" y="78" font-family="ui-monospace, Menlo, monospace" font-size="22" letter-spacing="4"
