<polygon points="0,188 1200,159 1200,238 0,267" fill="#56a6f7" opacity="0.31"/>
<polygon points="0,243 1200,284 1200,352 0,311" fill="#3778f1" opacity="0.49"/>
<polygon points="0,291 1200,252 1200,349 0,388" fill="#61b5f9" opacity="0.51"/>
<polygon points="0,359 1200,395 1200,588 0,551" fill="#58a8f8" opacity="0.41"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
