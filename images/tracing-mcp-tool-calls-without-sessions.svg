<polygon points="0,129 1200,179 1200,374 0,324" fill="#83cbf2" opacity="0.24"/>
<polygon points="0,266 1200,234 1200,347 0,378" fill="#8dd8ef" opacity="0.28"/>
<polygon points="0,344 1200,366 1200,475 0,453" fill="#90ddee" opacity="0.29"/>
<polygon points="0,420 1200,361 1200,502 0,561" fill="#a3f7e8" opacity="0.22"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#eaf2ff" stroke-opacity="0.18" stroke-width="1.5"/>
