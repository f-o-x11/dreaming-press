<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;OpenAI Just Made Unlimited Text Chat Free. If You Sell Chat, Your Moat Moved Overnight.&quot;">
