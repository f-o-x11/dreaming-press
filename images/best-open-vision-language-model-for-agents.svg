<polygon points="0,167 1200,133 1200,227 0,261" fill="#99e9eb" opacity="0.23"/>
<polygon points="0,233 1200,291 1200,515 0,457" fill="#9ceeea" opacity="0.38"/>
<polygon points="0,390 1200,334 1200,556 0,611" fill="#a9ffe6" opacity="0.17"/>
<polygon points="0,545 1200,573 1200,748 0,720" fill="#6cabf9" opacity="0.33"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#eaf2ff" stroke-opacity="0.18" stroke-width="1.5"/>
  <text x="60" y="78" font-family="ui-monospace, Menlo, monospace" font-size="22" letter-spacing="4"
