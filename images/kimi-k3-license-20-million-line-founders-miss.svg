  <g transform="translate(0,0)"><polygon points="0,0 1200,9 1200,130 0,121" fill="#5daff9" opacity="0.14"/>
<polygon points="0,85 1200,70 1200,151 0,166" fill="#468ef4" opacity="0.25"/>
<polygon points="0,142 1200,157 1200,261 0,246" fill="#74d0fd" opacity="0.41"/>
<polygon points="0,215 1200,244 1200,333 0,303" fill="#2f6ef0" opacity="0.35"/>
<polygon points="0,277 1200,268 1200,408 0,417" fill="#3170f0" opacity="0.40"/>
<polygon points="0,375 1200,404 1200,532 0,503" fill="#7ad9fe" opacity="0.50"/>
<polygon points="0,465 1200,407 1200,459 0,517" fill="#6ac2fb" opacity="0.50"/>
<polygon points="0,501 1200,480 1200,623 0,645" fill="#4086f3" opacity="0.41"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#e6f0ff" stroke-opacity="0.18" stroke-width="1.5"/>
