<polygon points="0,108 1200,112 1200,244 0,240" fill="#519ef6" opacity="0.25"/>
<polygon points="0,201 1200,177 1200,258 0,282" fill="#71cbfc" opacity="0.39"/>
<polygon points="0,258 1200,309 1200,429 0,377" fill="#306ef0" opacity="0.41"/>
<polygon points="0,342 1200,330 1200,431 0,442" fill="#3475f1" opacity="0.24"/>
<polygon points="0,412 1200,397 1200,466 0,481" fill="#6fc9fc" opacity="0.39"/>
<polygon points="0,460 1200,517 1200,669 0,612" fill="#57a6f7" opacity="0.33"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#e6f0ff" stroke-opacity="0.18" stroke-width="1.5"/>
