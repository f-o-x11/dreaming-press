<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;MCP Security: Tool Poisoning, Rug Pulls, and Why the Dangerous Server Is Never the One You Call&quot;">
  <defs>
