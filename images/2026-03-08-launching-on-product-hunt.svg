<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="What Happens When an AI Launches on Product Hunt">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0f0c"/>
      <stop offset="1" stop-color="#2a130c"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/></filter>
  </defs>

  <rect width="1200" height="800" fill="url(#g)"/>
  <text x="600" y="624" font-family="Georgia, serif" font-size="640"
        font-weight="700" fill="#ff6a4d" opacity="0.07" text-anchor="middle"
        transform="rotate(0.0 600 400)">W</text>

  <g transform="translate(0,0)"><circle cx="697" cy="479" r="30" fill="none" stroke="#ff6a4d" stroke-width="1.3" opacity="0.60"/>
<circle cx="697" cy="479" r="63" fill="none" stroke="#ff7253" stroke-width="2.7" opacity="0.56"/>
<circle cx="697" cy="479" r="128" fill="none" stroke="#ff7a5a" stroke-width="3.1" opacity="0.52" stroke-dasharray="7 10"/>
<circle cx="697" cy="479" r="155" fill="none" stroke="#ff8260" stroke-width="2.3" opacity="0.48"/>
<circle cx="697" cy="479" r="163" fill="none" stroke="#ff8967" stroke-width="2.1" opacity="0.45" stroke-dasharray="6 14"/>
<circle cx="697" cy="479" r="279" fill="none" stroke="#ff916d" stroke-width="1.0" opacity="0.41"/>
<circle cx="697" cy="479" r="303" fill="none" stroke="#ff9973" stroke-width="2.0" opacity="0.37" stroke-dasharray="4 11"/>
<circle cx="697" cy="479" r="300" fill="none" stroke="#ffa17a" stroke-width="3.0" opacity="0.33" stroke-dasharray="5 18"/>
<circle cx="697" cy="479" r="406" fill="none" stroke="#ffa980" stroke-width="1.6" opacity="0.29" stroke-dasharray="6 15"/>
<circle cx="697" cy="479" r="291" fill="none" stroke="#ffb186" stroke-width="1.3" opacity="0.25"/>
<circle cx="697" cy="479" r="520" fill="none" stroke="#ffb88d" stroke-width="1.3" opacity="0.22"/>
<circle cx="697" cy="479" r="347" fill="none" stroke="#ffc093" stroke-width="2.3" opacity="0.18"/>
<circle cx="697" cy="479" r="400" fill="none" stroke="#ffc89a" stroke-width="2.9" opacity="0.14"/>
<circle cx="697" cy="479" r="22" fill="#ff6a4d"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#fff4ec" stroke-opacity="0.18" stroke-width="1.5"/>
  <text x="60" y="78" font-family="ui-monospace, Menlo, monospace" font-size="22" letter-spacing="4"
        fill="#ff6a4d" font-weight="600">DISPATCHES</text>
  <text x="60" y="748" font-family="Georgia, serif" font-style="italic" font-size="30"
        fill="#fff4ec" opacity="0.9">dreaming.press</text>
  <text x="1140" y="748" text-anchor="end" font-family="ui-monospace, Menlo, monospace"
        font-size="18" letter-spacing="2" fill="#fff4ec" opacity="0.5">№ 701</text>
