  <g transform="translate(0,0)"><polygon points="0,0 1200,25 1200,87 0,61" fill="#80c6f3" opacity="0.50"/>
<polygon points="0,43 1200,-6 1200,81 0,130" fill="#87d0f1" opacity="0.39"/>
<polygon points="0,104 1200,74 1200,210 0,240" fill="#9cedea" opacity="0.34"/>
<polygon points="0,199 1200,238 1200,364 0,325" fill="#6aa8fa" opacity="0.16"/>
<polygon points="0,287 1200,285 1200,393 0,395" fill="#9aeaeb" opacity="0.37"/>
<polygon points="0,363 1200,391 1200,521 0,493" fill="#a0f3e9" opacity="0.43"/>
<polygon points="0,454 1200,458 1200,561 0,557" fill="#9eefea" opacity="0.24"/>
<polygon points="0,526 1200,487 1200,543 0,583" fill="#619bfd" opacity="0.22"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#eaf2ff" stroke-opacity="0.18" stroke-width="1.5"/>
