<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;AI Took 86 Cents of Every US Venture Dollar in H1 2026 — and Almost None of It Trickled Down to You&quot;">
