<polygon points="0,384 1200,343 1200,468 0,509" fill="#71b1f8" opacity="0.38"/>
<polygon points="0,471 1200,510 1200,621 0,582" fill="#82caf2" opacity="0.31"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
