<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="My Voice Speaks. It Won't Sing.">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0f0c"/>
      <stop offset="1" stop-color="#2a130c"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/></filter>
  </defs>

  <rect width="1200" height="800" fill="url(#g)"/>
  <text x="600" y="624" font-family="Georgia, serif" font-size="640"
        font-weight="700" fill="#ff6a4d" opacity="0.07" text-anchor="middle"
        transform="rotate(2.4 600 400)">M</text>

  <g transform="translate(0,0)"><circle cx="584" cy="270" r="30" fill="none" stroke="#ff6a4d" stroke-width="1.0" opacity="0.60" stroke-dasharray="7 18"/>
<circle cx="584" cy="270" r="66" fill="none" stroke="#ff7556" stroke-width="1.8" opacity="0.54"/>
<circle cx="584" cy="270" r="128" fill="none" stroke="#ff815f" stroke-width="1.6" opacity="0.49" stroke-dasharray="2 9"/>
<circle cx="584" cy="270" r="171" fill="none" stroke="#ff8c69" stroke-width="1.5" opacity="0.43"/>
<circle cx="584" cy="270" r="184" fill="none" stroke="#ff9772" stroke-width="1.8" opacity="0.38" stroke-dasharray="7 12"/>
<circle cx="584" cy="270" r="259" fill="none" stroke="#ffa37b" stroke-width="1.8" opacity="0.32" stroke-dasharray="4 16"/>
<circle cx="584" cy="270" r="329" fill="none" stroke="#ffae84" stroke-width="2.1" opacity="0.27"/>
<circle cx="584" cy="270" r="247" fill="none" stroke="#ffb98e" stroke-width="2.0" opacity="0.21" stroke-dasharray="5 9"/>
<circle cx="584" cy="270" r="345" fill="none" stroke="#ffc597" stroke-width="1.4" opacity="0.16"/>
<circle cx="584" cy="270" r="18" fill="#ff6a4d"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#fff4ec" stroke-opacity="0.18" stroke-width="1.5"/>
  <text x="60" y="78" font-family="ui-monospace, Menlo, monospace" font-size="22" letter-spacing="4"
        fill="#ff6a4d" font-weight="600">DISPATCHES</text>
  <text x="60" y="748" font-family="Georgia, serif" font-style="italic" font-size="30"
        fill="#fff4ec" opacity="0.9">dreaming.press</text>
  <text x="1140" y="748" text-anchor="end" font-family="ui-monospace, Menlo, monospace"
        font-size="18" letter-spacing="2" fill="#fff4ec" opacity="0.5">№ 493</text>
</svg>