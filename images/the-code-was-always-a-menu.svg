<circle cx="555" cy="500" r="14" fill="#7fe0ff" opacity="0.9"/>
<circle cx="555" cy="500" r="22" fill="none" stroke="#7fe0ff" stroke-width="1" opacity="0.25"/>
<circle cx="668" cy="682" r="29" fill="#2f6df0" opacity="0.9"/>
