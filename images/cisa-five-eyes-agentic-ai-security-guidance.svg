  <g transform="translate(0,0)"><polygon points="0,0 1200,56 1200,191 0,135" fill="#3e83f3" opacity="0.46"/>
<polygon points="0,95 1200,112 1200,223 0,205" fill="#4891f5" opacity="0.35"/>
<polygon points="0,172 1200,223 1200,418 0,367" fill="#66bcfa" opacity="0.51"/>
<polygon points="0,308 1200,345 1200,523 0,487" fill="#6fc9fc" opacity="0.14"/>
<polygon points="0,433 1200,431 1200,570 0,572" fill="#7fe0ff" opacity="0.22"/>
<polygon points="0,531 1200,494 1200,627 0,664" fill="#6bc3fb" opacity="0.26"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#e6f0ff" stroke-opacity="0.18" stroke-width="1.5"/>
  <text x="60" y="78" font-family="ui-monospace, Menlo, monospace" font-size="22" letter-spacing="4"
