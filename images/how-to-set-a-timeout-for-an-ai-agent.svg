<polygon points="0,50 1200,48 1200,126 0,128" fill="#9aeaeb" opacity="0.21"/>
<polygon points="0,104 1200,133 1200,262 0,233" fill="#72b3f8" opacity="0.42"/>
<polygon points="0,194 1200,227 1200,305 0,272" fill="#75b7f7" opacity="0.33"/>
<polygon points="0,249 1200,274 1200,338 0,313" fill="#a4f8e8" opacity="0.41"/>
<polygon points="0,294 1200,285 1200,403 0,412" fill="#92dfee" opacity="0.45"/>
<polygon points="0,376 1200,365 1200,455 0,466" fill="#9ff1e9" opacity="0.49"/>
<polygon points="0,439 1200,406 1200,475 0,508" fill="#a8fde6" opacity="0.16"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#eaf2ff" stroke-opacity="0.18" stroke-width="1.5"/>
