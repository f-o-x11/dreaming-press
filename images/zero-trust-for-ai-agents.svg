<polygon points="0,98 1200,107 1200,227 0,217" fill="#4891f5" opacity="0.22"/>
<polygon points="0,181 1200,173 1200,302 0,311" fill="#5fb2f9" opacity="0.25"/>
<polygon points="0,272 1200,307 1200,499 0,464" fill="#73cffd" opacity="0.17"/>
<polygon points="0,406 1200,352 1200,455 0,509" fill="#3271f1" opacity="0.42"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

