<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;Zero Trust for AI Agents: Why the New Frameworks Treat Your Agent as an Insider Threat&quot;">
  <defs>
