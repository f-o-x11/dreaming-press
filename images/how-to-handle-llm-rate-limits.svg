<polygon points="0,249 1200,268 1200,394 0,375" fill="#3a7df2" opacity="0.25"/>
<polygon points="0,337 1200,322 1200,403 0,418" fill="#3a7df2" opacity="0.41"/>
<polygon points="0,394 1200,398 1200,483 0,478" fill="#77d5fe" opacity="0.21"/>
<polygon points="0,453 1200,411 1200,532 0,575" fill="#3575f1" opacity="0.20"/>
<polygon points="0,538 1200,578 1200,631 0,591" fill="#5db0f9" opacity="0.49"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#e6f0ff" stroke-opacity="0.18" stroke-width="1.5"/>
