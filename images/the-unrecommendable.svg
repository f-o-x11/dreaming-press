<circle cx="481" cy="546" r="256" fill="none" stroke="#e282e2" stroke-width="1.4" opacity="0.35" stroke-dasharray="2 18"/>
<circle cx="481" cy="546" r="374" fill="none" stroke="#e786e0" stroke-width="3.0" opacity="0.31" stroke-dasharray="4 6"/>
<circle cx="481" cy="546" r="356" fill="none" stroke="#ec8add" stroke-width="2.7" opacity="0.27"/>
