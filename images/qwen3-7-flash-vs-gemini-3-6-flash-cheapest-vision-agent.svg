<polygon points="0,144 1200,196 1200,282 0,230" fill="#6eadf9" opacity="0.32"/>
<polygon points="0,205 1200,163 1200,366 0,407" fill="#89d2f0" opacity="0.33"/>
<polygon points="0,347 1200,354 1200,445 0,437" fill="#65a1fc" opacity="0.29"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
