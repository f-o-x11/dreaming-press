<polygon points="0,134 1200,79 1200,167 0,222" fill="#61b5f9" opacity="0.23"/>
<polygon points="0,195 1200,245 1200,385 0,336" fill="#3372f1" opacity="0.20"/>
<polygon points="0,294 1200,311 1200,533 0,516" fill="#76d4fd" opacity="0.37"/>
<polygon points="0,449 1200,502 1200,652 0,599" fill="#6fc9fc" opacity="0.21"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#e6f0ff" stroke-opacity="0.18" stroke-width="1.5"/>
