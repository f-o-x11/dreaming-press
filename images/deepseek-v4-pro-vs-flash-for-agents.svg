<polygon points="0,102 1200,103 1200,175 0,174" fill="#58a9f8" opacity="0.39"/>
<polygon points="0,152 1200,143 1200,228 0,236" fill="#3373f1" opacity="0.35"/>
<polygon points="0,211 1200,181 1200,321 0,352" fill="#306ff0" opacity="0.35"/>
<polygon points="0,310 1200,332 1200,480 0,458" fill="#52a0f7" opacity="0.51"/>
<polygon points="0,413 1200,394 1200,575 0,595" fill="#3272f1" opacity="0.29"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#e6f0ff" stroke-opacity="0.18" stroke-width="1.5"/>
  <text x="60" y="78" font-family="ui-monospace, Menlo, monospace" font-size="22" letter-spacing="4"
