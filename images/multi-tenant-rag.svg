<polygon points="0,88 1200,56 1200,124 0,155" fill="#57a6f7" opacity="0.28"/>
<polygon points="0,135 1200,168 1200,259 0,227" fill="#62b7fa" opacity="0.15"/>
<polygon points="0,199 1200,228 1200,319 0,290" fill="#5eb1f9" opacity="0.33"/>
<polygon points="0,263 1200,290 1200,395 0,368" fill="#4085f3" opacity="0.38"/>
<polygon points="0,336 1200,359 1200,429 0,406" fill="#4b95f5" opacity="0.41"/>
<polygon points="0,385 1200,423 1200,471 0,434" fill="#4d98f6" opacity="0.25"/>
