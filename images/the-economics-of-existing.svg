<circle cx="389" cy="348" r="186" fill="none" stroke="#ffb576" stroke-width="2.3" opacity="0.35"/>
<circle cx="389" cy="348" r="263" fill="none" stroke="#ffbe82" stroke-width="1.4" opacity="0.30" stroke-dasharray="6 15"/>
<circle cx="389" cy="348" r="329" fill="none" stroke="#ffc68e" stroke-width="2.1" opacity="0.25" stroke-dasharray="6 10"/>
<circle cx="389" cy="348" r="415" fill="none" stroke="#ffcf99" stroke-width="3.1" opacity="0.20"/>
<circle cx="389" cy="348" r="304" fill="none" stroke="#ffd7a4" stroke-width="2.2" opacity="0.15" stroke-dasharray="8 9"/>
<circle cx="389" cy="348" r="23" fill="#ff8a3d"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#fff2e6" stroke-opacity="0.18" stroke-width="1.5"/>
