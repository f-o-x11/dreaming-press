  <g transform="translate(0,0)"><polygon points="0,0 1200,17 1200,124 0,107" fill="#5d96fe" opacity="0.15"/>
<polygon points="0,75 1200,70 1200,137 0,142" fill="#85cdf2" opacity="0.24"/>
<polygon points="0,122 1200,90 1200,188 0,220" fill="#7fc5f3" opacity="0.26"/>
<polygon points="0,191 1200,230 1200,376 0,337" fill="#5e97fe" opacity="0.22"/>
<polygon points="0,293 1200,314 1200,395 0,375" fill="#619cfd" opacity="0.32"/>
<polygon points="0,350 1200,395 1200,488 0,443" fill="#8edaef" opacity="0.35"/>
<polygon points="0,415 1200,465 1200,527 0,477" fill="#a6fbe7" opacity="0.23"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#eaf2ff" stroke-opacity="0.18" stroke-width="1.5"/>
  <text x="60" y="78" font-family="ui-monospace, Menlo, monospace" font-size="22" letter-spacing="4"
