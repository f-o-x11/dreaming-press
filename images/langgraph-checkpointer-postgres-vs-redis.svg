  <g transform="translate(0,0)"><polygon points="0,0 1200,7 1200,72 0,66" fill="#3576f1" opacity="0.16"/>
<polygon points="0,46 1200,60 1200,134 0,121" fill="#72cefd" opacity="0.38"/>
<polygon points="0,98 1200,62 1200,126 0,162" fill="#66bcfa" opacity="0.13"/>
<polygon points="0,143 1200,155 1200,278 0,266" fill="#7dddff" opacity="0.42"/>
<polygon points="0,229 1200,234 1200,289 0,284" fill="#4992f5" opacity="0.41"/>
<polygon points="0,267 1200,259 1200,338 0,346" fill="#397bf2" opacity="0.44"/>
<polygon points="0,322 1200,335 1200,412 0,399" fill="#5daff9" opacity="0.35"/>
<polygon points="0,376 1200,430 1200,512 0,458" fill="#77d5fe" opacity="0.24"/>
<polygon points="0,434 1200,423 1200,470 0,481" fill="#5bacf8" opacity="0.17"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#e6f0ff" stroke-opacity="0.18" stroke-width="1.5"/>
