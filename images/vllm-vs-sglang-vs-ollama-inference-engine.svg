<polygon points="0,96 1200,42 1200,228 0,282" fill="#6dc6fc" opacity="0.22"/>
<polygon points="0,226 1200,264 1200,348 0,311" fill="#72cdfd" opacity="0.36"/>
<polygon points="0,285 1200,228 1200,398 0,455" fill="#75d2fd" opacity="0.12"/>
<polygon points="0,404 1200,414 1200,565 0,556" fill="#458df4" opacity="0.48"/>
<polygon points="0,510 1200,474 1200,634 0,670" fill="#3373f1" opacity="0.34"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

