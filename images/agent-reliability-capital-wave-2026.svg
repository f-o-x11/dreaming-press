<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;The Money Moved to Agent Reliability: Three July Rounds That Show Where 2026 Capital Is Going&quot;">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07121f"/>
      <stop offset="1" stop-color="#0b1f33"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/></filter>
  </defs>

  <rect width="1200" height="800" fill="url(#g)"/>
  <text x="600" y="624" font-family="Georgia, serif" font-size="640"
        font-weight="700" fill="#5b93ff" opacity="0.07" text-anchor="middle"
        transform="rotate(-2.2 600 400)">&quot;</text>

  <g transform="translate(0,0)"><polygon points="0,0 1200,52 1200,175 0,124" fill="#79bdf5" opacity="0.50"/>
<polygon points="0,87 1200,48 1200,143 0,181" fill="#a1f3e9" opacity="0.16"/>
<polygon points="0,153 1200,123 1200,251 0,281" fill="#78bbf6" opacity="0.40"/>
<polygon points="0,242 1200,268 1200,329 0,303" fill="#6dabf9" opacity="0.19"/>
<polygon points="0,285 1200,327 1200,426 0,384" fill="#78bbf6" opacity="0.38"/>
<polygon points="0,354 1200,344 1200,444 0,454" fill="#90ddee" opacity="0.39"/>
<polygon points="0,424 1200,396 1200,478 0,507" fill="#74b6f7" opacity="0.41"/>
<polygon points="0,482 1200,439 1200,484 0,527" fill="#7bbff5" opacity="0.26"/>
<polygon points="0,514 1200,477 1200,521 0,558" fill="#6eadf9" opacity="0.31"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#eaf2ff" stroke-opacity="0.18" stroke-width="1.5"/>
