<polygon points="0,132 1200,165 1200,257 0,224" fill="#6ba9fa" opacity="0.24"/>
<polygon points="0,196 1200,229 1200,338 0,305" fill="#81c7f3" opacity="0.25"/>
<polygon points="0,273 1200,260 1200,451 0,463" fill="#76b9f6" opacity="0.37"/>
<polygon points="0,406 1200,435 1200,571 0,542" fill="#64a0fc" opacity="0.14"/>
<polygon points="0,501 1200,454 1200,566 0,614" fill="#88d1f1" opacity="0.14"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
