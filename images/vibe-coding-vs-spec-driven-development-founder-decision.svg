<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;Vibe Coding vs Spec-Driven Development: The Solo Founder's 2026 Decision&quot;">
  <defs>
