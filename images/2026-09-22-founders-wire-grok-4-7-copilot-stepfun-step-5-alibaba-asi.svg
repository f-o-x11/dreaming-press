<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;The Founder's Wire, September 22: Grok 4.7 Lands in Every Copilot Tier at $2/$6, StepFun Undercuts the Frontier by 7x, and Alibaba Maps a 10-Trillion-Parameter Road&quot;">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07121f"/>
      <stop offset="1" stop-color="#0b1f33"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/></filter>
  </defs>

  <rect width="1200" height="800" fill="url(#g)"/>
  <text x="600" y="624" font-family="Georgia, serif" font-size="640"
        font-weight="700" fill="#5b93ff" opacity="0.07" text-anchor="middle"
        transform="rotate(-2.8 600 400)">&quot;</text>

  <g transform="translate(0,0)"><polygon points="0,0 1200,-24 1200,89 0,113" fill="#89d3f0" opacity="0.25"/>
<polygon points="0,79 1200,131 1200,219 0,167" fill="#98e7eb" opacity="0.45"/>
<polygon points="0,140 1200,196 1200,246 0,190" fill="#88d1f1" opacity="0.27"/>
<polygon points="0,175 1200,233 1200,293 0,234" fill="#609afd" opacity="0.26"/>
<polygon points="0,216 1200,231 1200,307 0,292" fill="#a5fae7" opacity="0.38"/>
<polygon points="0,269 1200,285 1200,385 0,370" fill="#69a6fb" opacity="0.36"/>
<polygon points="0,339 1200,387 1200,498 0,451" fill="#5e97fe" opacity="0.26"/>
<polygon points="0,417 1200,472 1200,537 0,482" fill="#8bd6f0" opacity="0.25"/>
<polygon points="0,463 1200,467 1200,588 0,584" fill="#77b9f6" opacity="0.14"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#eaf2ff" stroke-opacity="0.18" stroke-width="1.5"/>
