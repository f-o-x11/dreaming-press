<circle cx="600" cy="451" r="250" fill="none" stroke="#ffaa68" stroke-width="1.4" opacity="0.41" stroke-dasharray="4 6"/>
<circle cx="600" cy="451" r="366" fill="none" stroke="#ffb06f" stroke-width="3.4" opacity="0.38" stroke-dasharray="6 7"/>
<circle cx="600" cy="451" r="420" fill="none" stroke="#ffb576" stroke-width="2.2" opacity="0.35"/>
<circle cx="600" cy="451" r="400" fill="none" stroke="#ffba7e" stroke-width="2.3" opacity="0.32" stroke-dasharray="2 17"/>
<circle cx="600" cy="451" r="360" fill="none" stroke="#ffc085" stroke-width="1.2" opacity="0.29" stroke-dasharray="3 8"/>
