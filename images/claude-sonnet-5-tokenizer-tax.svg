<polygon points="0,79 1200,99 1200,158 0,138" fill="#4891f5" opacity="0.18"/>
<polygon points="0,120 1200,86 1200,187 0,222" fill="#3e83f3" opacity="0.27"/>
<polygon points="0,191 1200,202 1200,310 0,299" fill="#5aabf8" opacity="0.40"/>
<polygon points="0,267 1200,268 1200,314 0,313" fill="#4d98f6" opacity="0.38"/>
<polygon points="0,299 1200,282 1200,352 0,369" fill="#448bf4" opacity="0.47"/>
<polygon points="0,348 1200,324 1200,441 0,466" fill="#397bf2" opacity="0.29"/>
<polygon points="0,431 1200,389 1200,485 0,527" fill="#3475f1" opacity="0.22"/>
<polygon points="0,498 1200,491 1200,573 0,580" fill="#69c0fb" opacity="0.23"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#e6f0ff" stroke-opacity="0.18" stroke-width="1.5"/>
