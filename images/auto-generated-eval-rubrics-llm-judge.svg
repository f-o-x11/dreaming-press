<polygon points="0,130 1200,120 1200,198 0,208" fill="#8fdbee" opacity="0.20"/>
<polygon points="0,184 1200,197 1200,334 0,321" fill="#99e9eb" opacity="0.48"/>
<polygon points="0,280 1200,259 1200,367 0,388" fill="#7abef5" opacity="0.21"/>
<polygon points="0,355 1200,319 1200,445 0,482" fill="#5c95ff" opacity="0.15"/>
<polygon points="0,444 1200,451 1200,526 0,519" fill="#84cbf2" opacity="0.34"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#eaf2ff" stroke-opacity="0.18" stroke-width="1.5"/>
  <text x="60" y="78" font-family="ui-monospace, Menlo, monospace" font-size="22" letter-spacing="4"
