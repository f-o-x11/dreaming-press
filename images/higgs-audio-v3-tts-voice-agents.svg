<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;Higgs Audio v3: A Chat-Native Open TTS for Voice Agents — With a License You Have to Read&quot;">
