<polygon points="0,98 1200,147 1200,279 0,230" fill="#639efc" opacity="0.23"/>
<polygon points="0,190 1200,135 1200,292 0,346" fill="#90dcee" opacity="0.41"/>
<polygon points="0,299 1200,253 1200,342 0,388" fill="#8ed9ef" opacity="0.34"/>
<polygon points="0,361 1200,349 1200,536 0,549" fill="#7abdf5" opacity="0.36"/>
<polygon points="0,493 1200,511 1200,588 0,569" fill="#5f99fe" opacity="0.45"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

