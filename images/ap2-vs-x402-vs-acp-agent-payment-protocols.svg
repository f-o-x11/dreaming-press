<polygon points="0,222 1200,210 1200,349 0,362" fill="#59a9f8" opacity="0.34"/>
<polygon points="0,320 1200,344 1200,507 0,483" fill="#73cffd" opacity="0.33"/>
<polygon points="0,434 1200,464 1200,592 0,563" fill="#77d4fd" opacity="0.30"/>
<polygon points="0,524 1200,474 1200,551 0,601" fill="#75d1fd" opacity="0.17"/>
<polygon points="0,578 1200,574 1200,639 0,644" fill="#6cc5fc" opacity="0.46"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
