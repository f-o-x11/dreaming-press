<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;Your Agent Was Told to Pay a Stranger — and 4 in 26 Did: Hardening Payment-Capable Agents After the ThreatLabz Attacks&quot;">
