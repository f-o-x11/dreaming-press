<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;LongCat-2.0: China's Biggest Model Yet Was Trained on Domestic Chips — and Meituan Won't Say Whose&quot;">
  <defs>
