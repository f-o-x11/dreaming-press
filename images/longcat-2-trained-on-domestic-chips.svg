<polygon points="0,109 1200,59 1200,169 0,219" fill="#468ef4" opacity="0.38"/>
<polygon points="0,186 1200,185 1200,322 0,323" fill="#4c96f5" opacity="0.31"/>
<polygon points="0,282 1200,224 1200,375 0,433" fill="#4790f5" opacity="0.16"/>
<polygon points="0,388 1200,426 1200,550 0,512" fill="#4187f3" opacity="0.25"/>
<polygon points="0,475 1200,476 1200,603 0,602" fill="#519df6" opacity="0.41"/>
<polygon points="0,564 1200,511 1200,601 0,653" fill="#4086f3" opacity="0.21"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
