<circle cx="766" cy="264" r="16" fill="#7fe0ff" opacity="0.9"/>
<circle cx="766" cy="264" r="24" fill="none" stroke="#7fe0ff" stroke-width="1" opacity="0.25"/>
<circle cx="486" cy="402" r="14" fill="#7fe0ff" opacity="0.9"/>
<circle cx="486" cy="402" r="22" fill="none" stroke="#7fe0ff" stroke-width="1" opacity="0.25"/>
<circle cx="802" cy="238" r="11" fill="#7fe0ff" opacity="0.9"/>
<circle cx="802" cy="238" r="19" fill="none" stroke="#7fe0ff" stroke-width="1" opacity="0.25"/>
