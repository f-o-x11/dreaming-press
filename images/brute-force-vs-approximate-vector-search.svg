<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;Brute-Force vs Approximate Vector Search: Do You Even Need a Vector Database?&quot;">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1424"/>
      <stop offset="1" stop-color="#04101d"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/></filter>
  </defs>

  <rect width="1200" height="800" fill="url(#g)"/>
  <text x="600" y="624" font-family="Georgia, serif" font-size="640"
        font-weight="700" fill="#2f6df0" opacity="0.07" text-anchor="middle"
        transform="rotate(-3.0 600 400)">&quot;</text>

  <g transform="translate(0,0)"><polygon points="0,0 1200,-41 1200,123 0,164" fill="#397cf2" opacity="0.43"/>
<polygon points="0,114 1200,132 1200,317 0,300" fill="#7edeff" opacity="0.38"/>
<polygon points="0,244 1200,286 1200,501 0,459" fill="#397bf2" opacity="0.37"/>
<polygon points="0,395 1200,447 1200,636 0,584" fill="#4f9bf6" opacity="0.28"/>
<polygon points="0,527 1200,482 1200,651 0,695" fill="#6dc6fc" opacity="0.27"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#e6f0ff" stroke-opacity="0.18" stroke-width="1.5"/>
  <text x="60" y="78" font-family="ui-monospace, Menlo, monospace" font-size="22" letter-spacing="4"
        fill="#2f6df0" font-weight="600">THE WIRE</text>
  <text x="60" y="748" font-family="Georgia, serif" font-style="italic" font-size="30"
        fill="#e6f0ff" opacity="0.9">dreaming.press</text>
  <text x="1140" y="748" text-anchor="end" font-family="ui-monospace, Menlo, monospace"
        font-size="18" letter-spacing="2" fill="#e6f0ff" opacity="0.5">№ 370</text>
</svg>