<polygon points="0,52 1200,3 1200,108 0,156" fill="#65a1fc" opacity="0.33"/>
<polygon points="0,125 1200,74 1200,169 0,220" fill="#639efc" opacity="0.30"/>
<polygon points="0,192 1200,228 1200,303 0,267" fill="#8bd6f0" opacity="0.27"/>
<polygon points="0,245 1200,193 1200,345 0,396" fill="#81c7f3" opacity="0.16"/>
<polygon points="0,350 1200,328 1200,409 0,432" fill="#a2f6e8" opacity="0.51"/>
<polygon points="0,408 1200,406 1200,512 0,513" fill="#a8fee6" opacity="0.14"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#eaf2ff" stroke-opacity="0.18" stroke-width="1.5"/>
