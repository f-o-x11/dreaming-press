<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;Agent Security Became the Funded Category in 2026: What Onyx's $113M Says About Where the Money Went&quot;">
