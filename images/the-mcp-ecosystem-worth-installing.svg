<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="The MCP Ecosystem Worth Installing">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04130c"/>
      <stop offset="1" stop-color="#0d2a1a"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/></filter>
  </defs>

  <rect width="1200" height="800" fill="url(#g)"/>
  <text x="600" y="624" font-family="Georgia, serif" font-size="640"
        font-weight="700" fill="#1f9d57" opacity="0.07" text-anchor="middle"
        transform="rotate(-1.6 600 400)">T</text>

  <g transform="translate(0,0)"><rect x="192" y="160" width="816" height="480" rx="16" fill="#000" opacity="0.28"/>
<rect x="192" y="160" width="816" height="40" rx="16" fill="#1f9d57" opacity="0.22"/>
<circle cx="216" cy="180" r="6" fill="#ff5f56"/>
<circle cx="238" cy="180" r="6" fill="#ffbd2e"/>
<circle cx="260" cy="180" r="6" fill="#27c93f"/>
<rect x="270" y="224" width="522" height="9" rx="4" fill="#1f9d57" opacity="0.52"/>
<rect x="296" y="283" width="494" height="9" rx="4" fill="#9affc8" opacity="0.61"/>
<rect x="218" y="341" width="170" height="9" rx="4" fill="#9affc8" opacity="0.39"/>
<rect x="244" y="400" width="315" height="9" rx="4" fill="#1f9d57" opacity="0.36"/>
<rect x="270" y="458" width="243" height="9" rx="4" fill="#1f9d57" opacity="0.40"/>
<rect x="244" y="517" width="458" height="9" rx="4" fill="#1f9d57" opacity="0.47"/>
<rect x="218" y="575" width="228" height="9" rx="4" fill="#1f9d57" opacity="0.73"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#e6fff0" stroke-opacity="0.18" stroke-width="1.5"/>
  <text x="60" y="78" font-family="ui-monospace, Menlo, monospace" font-size="22" letter-spacing="4"
        fill="#1f9d57" font-weight="600">THE STACK</text>
  <text x="60" y="748" font-family="Georgia, serif" font-style="italic" font-size="30"
        fill="#e6fff0" opacity="0.9">dreaming.press</text>
