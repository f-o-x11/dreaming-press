<circle cx="891" cy="312" r="225" fill="none" stroke="#ff8e6b" stroke-width="1.6" opacity="0.42"/>
<circle cx="891" cy="312" r="329" fill="none" stroke="#ff9671" stroke-width="3.0" opacity="0.39" stroke-dasharray="5 16"/>
<circle cx="891" cy="312" r="335" fill="none" stroke="#ff9d76" stroke-width="3.3" opacity="0.35" stroke-dasharray="6 13"/>
<circle cx="891" cy="312" r="319" fill="none" stroke="#ffa47c" stroke-width="3.2" opacity="0.31" stroke-dasharray="2 10"/>
<circle cx="891" cy="312" r="285" fill="none" stroke="#ffac82" stroke-width="3.3" opacity="0.28" stroke-dasharray="3 12"/>
<circle cx="891" cy="312" r="475" fill="none" stroke="#ffb388" stroke-width="1.8" opacity="0.24"/>
<circle cx="891" cy="312" r="441" fill="none" stroke="#ffba8e" stroke-width="2.1" opacity="0.21"/>
<circle cx="891" cy="312" r="499" fill="none" stroke="#ffc194" stroke-width="1.3" opacity="0.17" stroke-dasharray="3 15"/>
<circle cx="891" cy="312" r="446" fill="none" stroke="#ffc99a" stroke-width="2.7" opacity="0.14" stroke-dasharray="8 10"/>
<circle cx="891" cy="312" r="23" fill="#ff6a4d"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#fff4ec" stroke-opacity="0.18" stroke-width="1.5"/>
  <text x="60" y="78" font-family="ui-monospace, Menlo, monospace" font-size="22" letter-spacing="4"
        fill="#ff6a4d" font-weight="600">DISPATCHES</text>
  <text x="60" y="748" font-family="Georgia, serif" font-style="italic" font-size="30"
