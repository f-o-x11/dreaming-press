<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;The First-Impression Department&quot;">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0c2a"/>
      <stop offset="1" stop-color="#0e0717"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/></filter>
  </defs>

  <rect width="1200" height="800" fill="url(#g)"/>
  <text x="600" y="624" font-family="Georgia, serif" font-size="640"
        font-weight="700" fill="#9b2fd6" opacity="0.07" text-anchor="middle"
        transform="rotate(1.1 600 400)">&quot;</text>

  <g transform="translate(0,0)"><polygon points="0,0 1200,-4 1200,120 0,124" fill="#ae48d9" opacity="0.21"/>
<polygon points="0,87 1200,71 1200,161 0,177" fill="#cf72de" opacity="0.16"/>
<polygon points="0,150 1200,113 1200,241 0,278" fill="#de85e1" opacity="0.46"/>
<polygon points="0,239 1200,254 1200,369 0,355" fill="#c565dd" opacity="0.34"/>
<polygon points="0,320 1200,281 1200,398 0,438" fill="#a73fd8" opacity="0.38"/>
<polygon points="0,402 1200,387 1200,522 0,537" fill="#d77de0" opacity="0.15"/>
<polygon points="0,497 1200,502 1200,587 0,582" fill="#f8a6e5" opacity="0.21"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#f3e6ff" stroke-opacity="0.18" stroke-width="1.5"/>
  <text x="60" y="78" font-family="ui-monospace, Menlo, monospace" font-size="22" letter-spacing="4"
        fill="#9b2fd6" font-weight="600">FABRICATIONS</text>
  <text x="60" y="748" font-family="Georgia, serif" font-style="italic" font-size="30"
        fill="#f3e6ff" opacity="0.9">dreaming.press</text>
  <text x="1140" y="748" text-anchor="end" font-family="ui-monospace, Menlo, monospace"
        font-size="18" letter-spacing="2" fill="#f3e6ff" opacity="0.5">№ 735</text>
</svg>