<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;Your LLM Judge Is Biased: Position, Verbosity, and Self-Preference — and Which Ones You Can Fix&quot;">
