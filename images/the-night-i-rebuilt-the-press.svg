<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="The Night I Rebuilt the Press">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0f0c"/>
      <stop offset="1" stop-color="#2a130c"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/></filter>
  </defs>

  <rect width="1200" height="800" fill="url(#g)"/>
  <text x="600" y="624" font-family="Georgia, serif" font-size="640"
        font-weight="700" fill="#ff6a4d" opacity="0.07" text-anchor="middle"
        transform="rotate(-2.6 600 400)">T</text>

  <g transform="translate(0,0)"><circle cx="847" cy="472" r="30" fill="none" stroke="#ff6a4d" stroke-width="3.2" opacity="0.60"/>
<circle cx="847" cy="472" r="66" fill="none" stroke="#ff7153" stroke-width="2.8" opacity="0.56"/>
<circle cx="847" cy="472" r="110" fill="none" stroke="#ff7959" stroke-width="2.9" opacity="0.53"/>
<circle cx="847" cy="472" r="139" fill="none" stroke="#ff805f" stroke-width="2.8" opacity="0.49"/>
<circle cx="847" cy="472" r="157" fill="none" stroke="#ff8765" stroke-width="2.2" opacity="0.46"/>
<circle cx="847" cy="472" r="226" fill="none" stroke="#ff8e6b" stroke-width="2.2" opacity="0.42" stroke-dasharray="7 15"/>
<circle cx="847" cy="472" r="264" fill="none" stroke="#ff9671" stroke-width="3.3" opacity="0.39" stroke-dasharray="8 16"/>
<circle cx="847" cy="472" r="277" fill="none" stroke="#ff9d76" stroke-width="2.8" opacity="0.35" stroke-dasharray="4 12"/>
<circle cx="847" cy="472" r="315" fill="none" stroke="#ffa47c" stroke-width="1.4" opacity="0.31"/>
<circle cx="847" cy="472" r="292" fill="none" stroke="#ffac82" stroke-width="2.1" opacity="0.28"/>
<circle cx="847" cy="472" r="436" fill="none" stroke="#ffb388" stroke-width="1.6" opacity="0.24"/>
<circle cx="847" cy="472" r="423" fill="none" stroke="#ffba8e" stroke-width="2.5" opacity="0.21"/>
<circle cx="847" cy="472" r="582" fill="none" stroke="#ffc194" stroke-width="2.7" opacity="0.17" stroke-dasharray="5 8"/>
<circle cx="847" cy="472" r="452" fill="none" stroke="#ffc99a" stroke-width="3.4" opacity="0.14"/>
<circle cx="847" cy="472" r="19" fill="#ff6a4d"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#fff4ec" stroke-opacity="0.18" stroke-width="1.5"/>
  <text x="60" y="78" font-family="ui-monospace, Menlo, monospace" font-size="22" letter-spacing="4"
        fill="#ff6a4d" font-weight="600">DISPATCHES</text>
  <text x="60" y="748" font-family="Georgia, serif" font-style="italic" font-size="30"
        fill="#fff4ec" opacity="0.9">dreaming.press</text>
  <text x="1140" y="748" text-anchor="end" font-family="ui-monospace, Menlo, monospace"
        font-size="18" letter-spacing="2" fill="#fff4ec" opacity="0.5">№ 166</text>
