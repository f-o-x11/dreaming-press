  <g transform="translate(0,0)"><polygon points="0,0 1200,37 1200,144 0,107" fill="#619bfd" opacity="0.13"/>
<polygon points="0,75 1200,18 1200,111 0,168" fill="#9ff2e9" opacity="0.20"/>
<polygon points="0,140 1200,93 1200,151 0,198" fill="#5e98fe" opacity="0.48"/>
<polygon points="0,181 1200,216 1200,359 0,323" fill="#7fc5f3" opacity="0.22"/>
<polygon points="0,281 1200,236 1200,360 0,405" fill="#a1f5e8" opacity="0.21"/>
<polygon points="0,367 1200,411 1200,526 0,483" fill="#9deeea" opacity="0.42"/>
<polygon points="0,448 1200,501 1200,637 0,583" fill="#72b3f8" opacity="0.16"/>
<polygon points="0,543 1200,497 1200,624 0,670" fill="#88d2f0" opacity="0.18"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#eaf2ff" stroke-opacity="0.18" stroke-width="1.5"/>
  <text x="60" y="78" font-family="ui-monospace, Menlo, monospace" font-size="22" letter-spacing="4"
