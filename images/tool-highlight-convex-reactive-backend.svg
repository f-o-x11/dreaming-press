<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;Tool Highlight: Convex — the reactive TypeScript backend a solo founder can ship a realtime AI app on&quot;">
