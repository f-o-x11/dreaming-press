  <g transform="translate(0,0)"><polygon points="0,0 1200,-19 1200,119 0,138" fill="#4c97f5" opacity="0.28"/>
<polygon points="0,97 1200,146 1200,218 0,169" fill="#4c96f5" opacity="0.51"/>
<polygon points="0,147 1200,110 1200,233 0,270" fill="#438af4" opacity="0.34"/>
<polygon points="0,234 1200,222 1200,299 0,310" fill="#7dddff" opacity="0.16"/>
<polygon points="0,287 1200,252 1200,323 0,357" fill="#55a4f7" opacity="0.25"/>
<polygon points="0,336 1200,392 1200,455 0,399" fill="#74d0fd" opacity="0.14"/>
<polygon points="0,380 1200,408 1200,493 0,466" fill="#57a6f7" opacity="0.47"/>
<polygon points="0,440 1200,480 1200,553 0,513" fill="#74d0fd" opacity="0.19"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#e6f0ff" stroke-opacity="0.18" stroke-width="1.5"/>
  <text x="60" y="78" font-family="ui-monospace, Menlo, monospace" font-size="22" letter-spacing="4"
