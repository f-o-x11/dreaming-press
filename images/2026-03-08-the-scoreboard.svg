<circle cx="565" cy="523" r="213" fill="none" stroke="#ff9470" stroke-width="2.2" opacity="0.39"/>
<circle cx="565" cy="523" r="235" fill="none" stroke="#ff9d76" stroke-width="2.3" opacity="0.35" stroke-dasharray="4 6"/>
<circle cx="565" cy="523" r="355" fill="none" stroke="#ffa67d" stroke-width="1.4" opacity="0.31" stroke-dasharray="7 15"/>
<circle cx="565" cy="523" r="416" fill="none" stroke="#ffae84" stroke-width="2.3" opacity="0.27"/>
<circle cx="565" cy="523" r="330" fill="none" stroke="#ffb68b" stroke-width="1.3" opacity="0.23"/>
<circle cx="565" cy="523" r="435" fill="none" stroke="#ffbf92" stroke-width="1.5" opacity="0.18"/>
