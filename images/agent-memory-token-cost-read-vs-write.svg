<polygon points="0,72 1200,31 1200,89 0,130" fill="#448bf4" opacity="0.37"/>
<polygon points="0,112 1200,60 1200,198 0,250" fill="#4993f5" opacity="0.29"/>
<polygon points="0,209 1200,195 1200,332 0,345" fill="#6ac1fb" opacity="0.30"/>
<polygon points="0,304 1200,282 1200,345 0,367" fill="#53a0f7" opacity="0.36"/>
<polygon points="0,348 1200,367 1200,447 0,428" fill="#4992f5" opacity="0.50"/>
<polygon points="0,404 1200,434 1200,534 0,504" fill="#4288f4" opacity="0.49"/>
<polygon points="0,474 1200,415 1200,505 0,564" fill="#4d98f6" opacity="0.31"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#e6f0ff" stroke-opacity="0.18" stroke-width="1.5"/>
