<polygon points="0,104 1200,62 1200,209 0,251" fill="#468ef4" opacity="0.51"/>
<polygon points="0,207 1200,260 1200,343 0,290" fill="#67befb" opacity="0.22"/>
<polygon points="0,265 1200,265 1200,397 0,397" fill="#78d6fe" opacity="0.40"/>
<polygon points="0,358 1200,319 1200,559 0,597" fill="#4992f5" opacity="0.45"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#e6f0ff" stroke-opacity="0.18" stroke-width="1.5"/>
