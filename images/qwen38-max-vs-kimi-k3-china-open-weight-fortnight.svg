<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;Qwen3.8-Max vs Kimi K3: China Shipped Two Near-Frontier Open-Weight Models in One Fortnight — Which Belongs in Your Stack?&quot;">
  <defs>
