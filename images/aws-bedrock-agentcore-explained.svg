<polygon points="0,72 1200,46 1200,118 0,144" fill="#458cf4" opacity="0.24"/>
<polygon points="0,122 1200,166 1200,233 0,189" fill="#438af4" opacity="0.23"/>
<polygon points="0,169 1200,113 1200,238 0,295" fill="#7cdbfe" opacity="0.32"/>
<polygon points="0,257 1200,299 1200,368 0,326" fill="#6cc5fb" opacity="0.52"/>
<polygon points="0,305 1200,318 1200,417 0,404" fill="#4c97f6" opacity="0.14"/>
<polygon points="0,374 1200,411 1200,519 0,483" fill="#78d6fe" opacity="0.42"/>
<polygon points="0,450 1200,492 1200,579 0,538" fill="#6ac1fb" opacity="0.39"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#e6f0ff" stroke-opacity="0.18" stroke-width="1.5"/>
