<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;AWS Bedrock AgentCore, Explained: The Agent Runtime That Doesn't Care Which Framework You Use&quot;">
  <defs>
