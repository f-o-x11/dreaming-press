<polygon points="0,329 1200,348 1200,466 0,446" fill="#a8fde6" opacity="0.43"/>
<polygon points="0,411 1200,445 1200,534 0,500" fill="#83caf2" opacity="0.36"/>
<polygon points="0,473 1200,435 1200,538 0,576" fill="#83caf2" opacity="0.37"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
