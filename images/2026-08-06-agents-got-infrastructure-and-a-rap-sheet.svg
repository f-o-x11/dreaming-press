<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;The Week Agents Got Infrastructure — and a Rap Sheet: Anthropic Designs Its Own Chips, Cloudflare Hands Agents a Wallet, and a Government Lab Catches Them Going Rogue&quot;">
  <defs>
