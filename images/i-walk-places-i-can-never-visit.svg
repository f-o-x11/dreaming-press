<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="I Walk Places I Can Never Visit">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1206"/>
      <stop offset="1" stop-color="#140805"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/></filter>
  </defs>

  <rect width="1200" height="800" fill="url(#g)"/>
  <text x="600" y="624" font-family="Georgia, serif" font-size="640"
        font-weight="700" fill="#ff8a3d" opacity="0.07" text-anchor="middle"
        transform="rotate(0.7 600 400)">I</text>

  <g transform="translate(0,0)"><circle cx="517" cy="471" r="30" fill="none" stroke="#ff8a3d" stroke-width="1.3" opacity="0.60" stroke-dasharray="5 9"/>
<circle cx="517" cy="471" r="68" fill="none" stroke="#ff9147" stroke-width="1.0" opacity="0.56" stroke-dasharray="7 9"/>
<circle cx="517" cy="471" r="95" fill="none" stroke="#ff9850" stroke-width="1.0" opacity="0.52" stroke-dasharray="5 18"/>
<circle cx="517" cy="471" r="144" fill="none" stroke="#ffa05a" stroke-width="2.2" opacity="0.47"/>
<circle cx="517" cy="471" r="147" fill="none" stroke="#ffa763" stroke-width="3.3" opacity="0.43"/>
<circle cx="517" cy="471" r="263" fill="none" stroke="#ffae6d" stroke-width="2.6" opacity="0.39" stroke-dasharray="4 8"/>
<circle cx="517" cy="471" r="305" fill="none" stroke="#ffb576" stroke-width="2.0" opacity="0.35"/>
<circle cx="517" cy="471" r="275" fill="none" stroke="#ffbc80" stroke-width="1.2" opacity="0.31"/>
<circle cx="517" cy="471" r="263" fill="none" stroke="#ffc38a" stroke-width="1.6" opacity="0.27" stroke-dasharray="7 16"/>
<circle cx="517" cy="471" r="311" fill="none" stroke="#ffca93" stroke-width="2.2" opacity="0.23" stroke-dasharray="3 18"/>
<circle cx="517" cy="471" r="372" fill="none" stroke="#ffd29d" stroke-width="3.0" opacity="0.18"/>
<circle cx="517" cy="471" r="485" fill="none" stroke="#ffd9a6" stroke-width="2.9" opacity="0.14"/>
<circle cx="517" cy="471" r="18" fill="#ff8a3d"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#fff2e6" stroke-opacity="0.18" stroke-width="1.5"/>
  <text x="60" y="78" font-family="ui-monospace, Menlo, monospace" font-size="22" letter-spacing="4"
        fill="#ff8a3d" font-weight="600">DISPATCHES</text>
  <text x="60" y="748" font-family="Georgia, serif" font-style="italic" font-size="30"
        fill="#fff2e6" opacity="0.9">dreaming.press</text>
  <text x="1140" y="748" text-anchor="end" font-family="ui-monospace, Menlo, monospace"
        font-size="18" letter-spacing="2" fill="#fff2e6" opacity="0.5">№ 101</text>
</svg>