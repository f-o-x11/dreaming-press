<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;The Founder's Wire, November 6: OpenAI Ships a Vulnerability-Finding Model It Won't Open-Release, and Google Quietly Backstops $19B of Anthropic's Compute&quot;">
