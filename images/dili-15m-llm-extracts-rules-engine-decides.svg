<polygon points="0,134 1200,145 1200,370 0,360" fill="#458cf4" opacity="0.27"/>
<polygon points="0,292 1200,299 1200,538 0,531" fill="#4c96f5" opacity="0.44"/>
<polygon points="0,459 1200,449 1200,546 0,556" fill="#53a0f7" opacity="0.34"/>
<polygon points="0,527 1200,535 1200,686 0,679" fill="#519ff6" opacity="0.13"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#e6f0ff" stroke-opacity="0.18" stroke-width="1.5"/>
