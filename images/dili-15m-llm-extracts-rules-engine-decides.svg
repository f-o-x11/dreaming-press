<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;A Compliance Startup Just Raised $15M by Never Letting the LLM Decide — Copy the Architecture&quot;">
  <defs>
