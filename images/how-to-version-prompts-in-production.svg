<polygon points="0,132 1200,95 1200,193 0,229" fill="#639efd" opacity="0.50"/>
<polygon points="0,200 1200,240 1200,370 0,329" fill="#69a6fb" opacity="0.43"/>
<polygon points="0,291 1200,283 1200,430 0,438" fill="#9defea" opacity="0.39"/>
<polygon points="0,394 1200,381 1200,502 0,515" fill="#85cdf2" opacity="0.30"/>
