<polygon points="0,73 1200,22 1200,113 0,163" fill="#74d1fd" opacity="0.47"/>
<polygon points="0,136 1200,94 1200,151 0,193" fill="#387af2" opacity="0.20"/>
<polygon points="0,176 1200,155 1200,211 0,232" fill="#5aabf8" opacity="0.36"/>
<polygon points="0,215 1200,252 1200,346 0,309" fill="#6bc4fb" opacity="0.33"/>
<polygon points="0,281 1200,330 1200,408 0,359" fill="#61b5f9" opacity="0.12"/>
<polygon points="0,336 1200,353 1200,446 0,428" fill="#448cf4" opacity="0.13"/>
<polygon points="0,401 1200,346 1200,429 0,484" fill="#3e83f3" opacity="0.15"/>
<polygon points="0,459 1200,495 1200,619 0,583" fill="#3d82f3" opacity="0.44"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#e6f0ff" stroke-opacity="0.18" stroke-width="1.5"/>
