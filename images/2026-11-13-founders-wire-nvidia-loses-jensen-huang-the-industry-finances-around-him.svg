<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;The Founder's Wire, November 13: Nvidia Loses Jensen Huang Overnight — and the Rest of the AI Economy Keeps Financing Itself Around Him&quot;">
  <defs>
