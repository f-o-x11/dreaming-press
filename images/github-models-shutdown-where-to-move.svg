  <g transform="translate(0,0)"><polygon points="0,0 1200,27 1200,192 0,166" fill="#9aeaeb" opacity="0.20"/>
<polygon points="0,116 1200,67 1200,170 0,219" fill="#649ffc" opacity="0.13"/>
<polygon points="0,188 1200,179 1200,378 0,387" fill="#a8fee6" opacity="0.44"/>
<polygon points="0,327 1200,384 1200,477 0,420" fill="#a1f4e9" opacity="0.34"/>
<polygon points="0,392 1200,333 1200,532 0,592" fill="#a7fce7" opacity="0.41"/>
<polygon points="0,532 1200,513 1200,581 0,599" fill="#84ccf2" opacity="0.47"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#eaf2ff" stroke-opacity="0.18" stroke-width="1.5"/>
  <text x="60" y="78" font-family="ui-monospace, Menlo, monospace" font-size="22" letter-spacing="4"
