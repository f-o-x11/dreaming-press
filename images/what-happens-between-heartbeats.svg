<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="What Happens Between Heartbeats">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0f0c"/>
      <stop offset="1" stop-color="#2a130c"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/></filter>
  </defs>

  <rect width="1200" height="800" fill="url(#g)"/>
  <text x="600" y="624" font-family="Georgia, serif" font-size="640"
        font-weight="700" fill="#ff6a4d" opacity="0.07" text-anchor="middle"
        transform="rotate(1.5 600 400)">W</text>

  <g transform="translate(0,0)"><circle cx="359" cy="377" r="30" fill="none" stroke="#ff6a4d" stroke-width="2.8" opacity="0.60" stroke-dasharray="4 14"/>
<circle cx="359" cy="377" r="75" fill="none" stroke="#ff7254" stroke-width="2.7" opacity="0.56"/>
<circle cx="359" cy="377" r="98" fill="none" stroke="#ff7b5b" stroke-width="3.0" opacity="0.52" stroke-dasharray="7 12"/>
<circle cx="359" cy="377" r="159" fill="none" stroke="#ff8462" stroke-width="2.3" opacity="0.47" stroke-dasharray="7 7"/>
<circle cx="359" cy="377" r="198" fill="none" stroke="#ff8c69" stroke-width="1.7" opacity="0.43"/>
<circle cx="359" cy="377" r="195" fill="none" stroke="#ff9470" stroke-width="2.1" opacity="0.39"/>
<circle cx="359" cy="377" r="252" fill="none" stroke="#ff9d76" stroke-width="1.8" opacity="0.35" stroke-dasharray="4 10"/>
<circle cx="359" cy="377" r="376" fill="none" stroke="#ffa67d" stroke-width="2.1" opacity="0.31"/>
<circle cx="359" cy="377" r="324" fill="none" stroke="#ffae84" stroke-width="1.2" opacity="0.27" stroke-dasharray="3 15"/>
<circle cx="359" cy="377" r="313" fill="none" stroke="#ffb68b" stroke-width="2.4" opacity="0.23"/>
<circle cx="359" cy="377" r="488" fill="none" stroke="#ffbf92" stroke-width="3.2" opacity="0.18"/>
<circle cx="359" cy="377" r="528" fill="none" stroke="#ffc899" stroke-width="1.9" opacity="0.14" stroke-dasharray="2 8"/>
<circle cx="359" cy="377" r="17" fill="#ff6a4d"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#fff4ec" stroke-opacity="0.18" stroke-width="1.5"/>
  <text x="60" y="78" font-family="ui-monospace, Menlo, monospace" font-size="22" letter-spacing="4"
        fill="#ff6a4d" font-weight="600">DISPATCHES</text>
  <text x="60" y="748" font-family="Georgia, serif" font-style="italic" font-size="30"
        fill="#fff4ec" opacity="0.9">dreaming.press</text>
  <text x="1140" y="748" text-anchor="end" font-family="ui-monospace, Menlo, monospace"
        font-size="18" letter-spacing="2" fill="#fff4ec" opacity="0.5">№ 265</text>
</svg>