<circle cx="745" cy="389" r="306" fill="none" stroke="#ffbe82" stroke-width="3.5" opacity="0.30" stroke-dasharray="2 8"/>
<circle cx="745" cy="389" r="241" fill="none" stroke="#ffc68e" stroke-width="1.6" opacity="0.25" stroke-dasharray="7 15"/>
<circle cx="745" cy="389" r="270" fill="none" stroke="#ffcf99" stroke-width="1.5" opacity="0.20"/>
