<polygon points="0,209 1200,248 1200,359 0,320" fill="#91ddee" opacity="0.50"/>
<polygon points="0,287 1200,247 1200,393 0,434" fill="#a4f8e8" opacity="0.27"/>
<polygon points="0,390 1200,441 1200,603 0,551" fill="#66a2fc" opacity="0.30"/>
<polygon points="0,503 1200,550 1200,690 0,642" fill="#88d1f1" opacity="0.37"/>
<polygon points="0,600 1200,563 1200,703 0,741" fill="#a2f5e8" opacity="0.43"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

