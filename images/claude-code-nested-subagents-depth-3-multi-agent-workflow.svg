<polygon points="0,45 1200,46 1200,115 0,114" fill="#73cffd" opacity="0.29"/>
<polygon points="0,94 1200,117 1200,209 0,186" fill="#316ff0" opacity="0.19"/>
<polygon points="0,158 1200,101 1200,168 0,225" fill="#4289f4" opacity="0.45"/>
<polygon points="0,205 1200,152 1200,273 0,327" fill="#6cc5fb" opacity="0.30"/>
<polygon points="0,290 1200,256 1200,336 0,370" fill="#3e82f3" opacity="0.18"/>
<polygon points="0,346 1200,330 1200,381 0,398" fill="#4b96f5" opacity="0.32"/>
<polygon points="0,382 1200,374 1200,483 0,492" fill="#6bc4fb" opacity="0.49"/>
<polygon points="0,459 1200,431 1200,527 0,555" fill="#77d5fe" opacity="0.42"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#e6f0ff" stroke-opacity="0.18" stroke-width="1.5"/>
