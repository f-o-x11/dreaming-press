<circle cx="370" cy="466" r="194" fill="none" stroke="#ffa763" stroke-width="2.0" opacity="0.43" stroke-dasharray="3 16"/>
<circle cx="370" cy="466" r="307" fill="none" stroke="#ffac6b" stroke-width="2.0" opacity="0.40"/>
<circle cx="370" cy="466" r="357" fill="none" stroke="#ffb273" stroke-width="1.1" opacity="0.37"/>
<circle cx="370" cy="466" r="381" fill="none" stroke="#ffb87a" stroke-width="1.3" opacity="0.33" stroke-dasharray="8 14"/>
<circle cx="370" cy="466" r="440" fill="none" stroke="#ffbe82" stroke-width="1.2" opacity="0.30"/>
