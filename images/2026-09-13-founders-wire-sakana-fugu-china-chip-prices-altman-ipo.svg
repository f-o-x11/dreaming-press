<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;The Founder's Wire, September 13: Sakana's Fugu Undercuts the Frontier by Routing Open Models, China's Chip Prices Jump on the HBM Squeeze, and Altman Calls a 2026 IPO 'Ill-Advised'&quot;">
  <defs>
