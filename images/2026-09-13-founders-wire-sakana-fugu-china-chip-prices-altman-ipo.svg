<polygon points="0,96 1200,104 1200,248 0,241" fill="#72cdfc" opacity="0.33"/>
<polygon points="0,197 1200,159 1200,234 0,273" fill="#3373f1" opacity="0.12"/>
<polygon points="0,250 1200,293 1200,393 0,350" fill="#519ff6" opacity="0.31"/>
<polygon points="0,320 1200,306 1200,390 0,405" fill="#6fc9fc" opacity="0.39"/>
<polygon points="0,380 1200,377 1200,462 0,465" fill="#3372f1" opacity="0.24"/>
<polygon points="0,439 1200,435 1200,581 0,586" fill="#4085f3" opacity="0.52"/>
<polygon points="0,542 1200,564 1200,671 0,648" fill="#5db0f9" opacity="0.23"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#e6f0ff" stroke-opacity="0.18" stroke-width="1.5"/>
