<polygon points="0,104 1200,56 1200,120 0,168" fill="#6bc3fb" opacity="0.43"/>
<polygon points="0,149 1200,98 1200,173 0,224" fill="#6bc3fb" opacity="0.43"/>
<polygon points="0,201 1200,240 1200,313 0,275" fill="#4288f4" opacity="0.48"/>
<polygon points="0,253 1200,296 1200,455 0,412" fill="#6fc9fc" opacity="0.21"/>
<polygon points="0,364 1200,364 1200,436 0,436" fill="#61b5f9" opacity="0.50"/>
<polygon points="0,415 1200,390 1200,532 0,556" fill="#4186f3" opacity="0.12"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#e6f0ff" stroke-opacity="0.18" stroke-width="1.5"/>
