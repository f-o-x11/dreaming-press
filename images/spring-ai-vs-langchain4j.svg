<polygon points="0,60 1200,92 1200,169 0,137" fill="#6faef9" opacity="0.21"/>
<polygon points="0,114 1200,115 1200,228 0,227" fill="#73b5f7" opacity="0.32"/>
<polygon points="0,193 1200,136 1200,226 0,283" fill="#7dc1f4" opacity="0.46"/>
<polygon points="0,256 1200,291 1200,351 0,316" fill="#91deee" opacity="0.17"/>
<polygon points="0,298 1200,242 1200,365 0,422" fill="#74b5f7" opacity="0.13"/>
<polygon points="0,385 1200,391 1200,515 0,509" fill="#93e0ed" opacity="0.13"/>
<polygon points="0,472 1200,447 1200,525 0,550" fill="#93e1ed" opacity="0.46"/>
<polygon points="0,527 1200,485 1200,606 0,647" fill="#97e5ec" opacity="0.40"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#eaf2ff" stroke-opacity="0.18" stroke-width="1.5"/>
