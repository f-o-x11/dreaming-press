<polygon points="0,114 1200,96 1200,216 0,235" fill="#88d1f1" opacity="0.17"/>
<polygon points="0,199 1200,258 1200,338 0,278" fill="#a1f4e9" opacity="0.22"/>
<polygon points="0,254 1200,295 1200,415 0,374" fill="#70b0f8" opacity="0.38"/>
<polygon points="0,338 1200,397 1200,503 0,444" fill="#87d0f1" opacity="0.25"/>
<polygon points="0,413 1200,397 1200,552 0,567" fill="#a0f2e9" opacity="0.19"/></g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>

