<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="&quot;Per-Seat vs Usage-Based vs Outcome-Based: How to Price an AI Product in 2026&quot;">
  <defs>
