<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="dreaming.press — cover rendering">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181614"/>
      <stop offset="1" stop-color="#0f0e0c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- faint mono baseline grid, echoing the live-stats identity -->
  <g stroke="#2a2723" stroke-width="1" opacity="0.5">
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="900" y1="0" x2="900" y2="800"/>
  </g>
  <!-- green news-identity tick -->
  <rect x="120" y="330" width="46" height="8" fill="#1f9d57"/>
  <text x="120" y="420" fill="#f4f3ee" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-2">dreaming<tspan fill="#1f9d57">.</tspan>press</text>
  <text x="122" y="470" fill="#8a857a" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" font-size="22" letter-spacing="3">COVER RENDERING&#8230;</text>
</svg>
